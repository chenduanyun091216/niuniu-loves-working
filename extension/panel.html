<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>牛牛爱上班</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icon.png" alt="">
      <div>
        <h1>牛牛爱上班</h1>
        <span>接口调试</span>
      </div>
    </div>
    <div class="topbar-meta">
      <span id="request-count">0 个请求</span>
      <label class="raw-toggle" title="显示未经解密或解码的请求和响应">
        <input id="raw-mode-toggle" type="checkbox" role="switch" aria-label="原始内容">
        <span class="raw-toggle-track" aria-hidden="true"></span>
        <span>原始内容</span>
      </label>
      <button id="open-settings" class="icon-button settings-button" type="button" title="解密设置" aria-label="解密设置">⚙</button>
      <span class="author">作者 Mr.Chen</span>
    </div>
  </header>

  <main class="workspace">
    <aside class="request-sidebar">
      <div class="list-toolbar">
        <label class="search-box">
          <span aria-hidden="true">⌕</span>
          <input id="request-search" type="search" placeholder="筛选接口" aria-label="筛选接口">
        </label>
        <button id="clear-requests" class="icon-button clear-button" type="button" title="清空请求" aria-label="清空请求"><span class="button-icon" aria-hidden="true">⌫</span><span>清空</span></button>
      </div>
      <div class="list-heading"><span>Name</span></div>
      <div id="request-list" class="request-list" role="listbox" aria-label="接口请求">
        <div class="list-empty">正在读取请求…</div>
      </div>
    </aside>
    <div id="resize-divider" class="resize-divider" role="separator" aria-orientation="vertical" aria-label="调整接口列表宽度" tabindex="0"></div>

    <section class="details" aria-label="请求详情">
      <div id="details-empty" class="details-empty">
        <div class="empty-mark">↗</div>
        <strong>选择一个接口查看详情</strong>
        <span>打开本面板后刷新页面以捕获全部请求</span>
      </div>
      <div id="details-view" class="details-view" hidden>
        <div class="request-summary">
          <div class="summary-line">
            <span id="detail-method" class="method-pill">GET</span>
            <strong id="detail-url" class="detail-url"></strong>
          </div>
          <div class="summary-meta">
            <span id="detail-status"></span>
            <span id="detail-duration"></span>
            <span id="response-state" class="response-state"></span>
          </div>
        </div>
        <nav class="detail-tabs" aria-label="请求信息">
          <button type="button" data-tab="headers" class="active"><svg class="tab-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M5 3.5h8M5 8h8M5 12.5h8"></path><path d="M2.5 3.5h.01M2.5 8h.01M2.5 12.5h.01"></path></svg><span>Headers</span></button>
          <button type="button" data-tab="payload"><svg class="tab-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M8 2.5v7"></path><path d="m5.2 6.8 2.8 2.8 2.8-2.8"></path><path d="M3.5 11.5v1.2A1.3 1.3 0 0 0 4.8 14h6.4a1.3 1.3 0 0 0 1.3-1.3v-1.2"></path></svg><span>Payload</span></button>
          <button type="button" data-tab="preview"><svg class="tab-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M1.8 8s2.1-3.7 6.2-3.7S14.2 8 14.2 8s-2.1 3.7-6.2 3.7S1.8 8 1.8 8Z"></path><circle cx="8" cy="8" r="1.6"></circle></svg><span>Preview</span></button>
          <button type="button" data-tab="response"><svg class="tab-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M4 1.8h5l3 3v9.4H4z"></path><path d="M9 1.8v3h3M6 8h4M6 10.5h4"></path></svg><span>Response</span></button>
          <button type="button" data-tab="sql"><svg class="tab-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><ellipse cx="8" cy="3.2" rx="4.7" ry="1.7"></ellipse><path d="M3.3 3.2v4.6c0 1 2.1 1.7 4.7 1.7s4.7-.7 4.7-1.7V3.2M3.3 7.8v4.6c0 1 2.1 1.7 4.7 1.7s4.7-.7 4.7-1.7V7.8"></path></svg><span>获取SQL</span></button>
        </nav>
        <div id="detail-content" class="detail-content"></div>
        <div id="response-search" class="response-search" hidden>
          <span class="response-search-icon" aria-hidden="true">⌕</span>
          <input id="response-search-input" type="search" placeholder="搜索 Response" aria-label="搜索 Response">
          <span id="response-search-count" class="response-search-count">0 个匹配</span>
          <button id="response-search-clear" class="response-search-clear" type="button" aria-label="清除搜索">×</button>
        </div>
      </div>
    </section>
  </main>

  <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
    <form id="settings-form">
      <h2 id="settings-title">解密设置</h2>
      <label class="settings-field" for="encryption-method">
        <span>解密方式</span>
        <select id="encryption-method">
          <option value="aes-ecb">AES（ECB / PKCS7）</option>
          <option value="des-ecb">DES（ECB / PKCS7）</option>
          <option value="3des-ecb">3DES（ECB / PKCS7）</option>
          <option value="base64">Base64（仅解码）</option>
        </select>
      </label>
      <label class="settings-field" for="aes-key">
        <span>解密密钥</span>
        <input id="aes-key" type="password" autocomplete="off" spellcheck="false" required>
      </label>
      <label class="settings-field" for="theme-select">
        <span>主题</span>
        <select id="theme-select">
          <option value="light">亮色主题</option>
          <option value="dark">暗色主题</option>
        </select>
      </label>
      <p class="settings-hint">解密方式、密钥和主题只保存在此扩展的本地配置中。</p>
      <p id="settings-error" class="settings-error" role="alert" hidden></p>
      <div class="settings-actions">
        <button id="reset-default-key" class="secondary-button" type="button">恢复默认</button>
        <span class="settings-spacer"></span>
        <button id="cancel-settings" class="secondary-button" type="button">取消</button>
        <button class="primary-button" type="submit">保存</button>
      </div>
    </form>
  </dialog>

  <script src="vendor/crypto-js.js"></script>
  <script type="module" src="panel.js"></script>
</body>
</html>
